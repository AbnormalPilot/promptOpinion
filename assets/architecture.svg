<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif">
  <!--
    ClinicalContext architecture diagram.
    Three-process system: A2A agent → MCP server → RAG service.
    Standards layer overlays (MCP / A2A / SHARP / FHIR) shown as labeled edges.
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0e0f0c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0a7a3b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6b3fa0"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="1200" height="760" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0e0f0c">
    ClinicalContext — Three-Service Architecture
  </text>
  <text x="600" y="62" font-size="13" text-anchor="middle" fill="#6b6b6b">
    Standards-native: MCP · A2A · SHARP · FHIR R4
  </text>

  <!-- Prompt Opinion Workspace (top) -->
  <rect x="350" y="90" width="500" height="64" rx="14" fill="#ffffff" stroke="#0e0f0c" stroke-width="2"/>
  <text x="600" y="118" font-size="15" font-weight="700" text-anchor="middle" fill="#0e0f0c">
    Prompt Opinion Workspace
  </text>
  <text x="600" y="138" font-size="12" text-anchor="middle" fill="#454745">
    any agent in the platform can compose ClinicalContext
  </text>

  <!-- A2A v1 edge -->
  <line x1="600" y1="154" x2="600" y2="200" stroke="#6b3fa0" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="448" y="160" width="304" height="20" rx="10" fill="#f1ebfb"/>
  <text x="600" y="174" font-size="11" text-anchor="middle" fill="#6b3fa0" font-weight="600">
    A2A v1 JSON-RPC · message/send · SHARP metadata
  </text>

  <!-- A2A Agent service box -->
  <rect x="60" y="200" width="1080" height="170" rx="18" fill="#ffffff" stroke="#0e0f0c" stroke-width="2"/>

  <!-- A2A header -->
  <rect x="60" y="200" width="1080" height="36" rx="18" fill="#0e0f0c"/>
  <text x="80" y="223" font-size="14" font-weight="700" fill="#ffffff">A2A Agent · port 8001</text>
  <text x="1120" y="223" font-size="12" text-anchor="end" fill="#cdcdcd">
    @google/adk · Gemini 2.5 Flash
  </text>

  <!-- A2A internal blocks -->
  <g>
    <rect x="80" y="250" width="240" height="100" rx="12" fill="#f4f4f4"/>
    <text x="92" y="270" font-size="12" font-weight="700" fill="#0e0f0c">app-factory.ts</text>
    <text x="92" y="290" font-size="11" fill="#454745">— Agent card</text>
    <text x="92" y="306" font-size="11" fill="#454745">— JSON-RPC handler</text>
    <text x="92" y="322" font-size="11" fill="#454745">— Session creation</text>
    <text x="92" y="338" font-size="11" fill="#454745">— Stateful per contextId</text>
  </g>

  <g>
    <rect x="340" y="250" width="240" height="100" rx="12" fill="#f4f4f4"/>
    <text x="352" y="270" font-size="12" font-weight="700" fill="#0e0f0c">agent.ts</text>
    <text x="352" y="290" font-size="11" fill="#454745">— Orchestration prompt</text>
    <text x="352" y="306" font-size="11" fill="#454745">— Tool-order policy</text>
    <text x="352" y="322" font-size="11" fill="#454745">— Markdown response format</text>
    <text x="352" y="338" font-size="11" fill="#454745">— Hallucination rules</text>
  </g>

  <g>
    <rect x="600" y="250" width="240" height="100" rx="12" fill="#f4f4f4"/>
    <text x="612" y="270" font-size="12" font-weight="700" fill="#0e0f0c">fhir-hook.ts</text>
    <text x="612" y="290" font-size="11" fill="#454745">— beforeModelCallback</text>
    <text x="612" y="306" font-size="11" fill="#454745">— extracts SHARP metadata</text>
    <text x="612" y="322" font-size="11" fill="#454745">— writes ADK State</text>
    <text x="612" y="338" font-size="11" fill="#a02525" font-weight="600">— token NEVER in prompt</text>
  </g>

  <g>
    <rect x="860" y="250" width="260" height="100" rx="12" fill="#f4f4f4"/>
    <text x="872" y="270" font-size="12" font-weight="700" fill="#0e0f0c">mcp-bridge.ts</text>
    <text x="872" y="290" font-size="11" fill="#454745">— FunctionTool wrappers (×11)</text>
    <text x="872" y="306" font-size="11" fill="#454745">— reads ADK State</text>
    <text x="872" y="322" font-size="11" fill="#454745">— injects 3 SHARP headers</text>
    <text x="872" y="338" font-size="11" fill="#454745">— SSE / JSON tolerant</text>
  </g>

  <!-- MCP edge -->
  <line x1="600" y1="370" x2="600" y2="412" stroke="#0a7a3b" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="380" y="372" width="440" height="20" rx="10" fill="#e8f4ec"/>
  <text x="600" y="386" font-size="11" text-anchor="middle" fill="#0a7a3b" font-weight="600">
    MCP HTTP · POST /mcp · 3 SHARP headers (x-fhir-server-url · x-fhir-access-token · x-patient-id)
  </text>

  <!-- MCP Server service box -->
  <rect x="60" y="412" width="1080" height="180" rx="18" fill="#ffffff" stroke="#0e0f0c" stroke-width="2"/>
  <rect x="60" y="412" width="1080" height="36" rx="18" fill="#0e0f0c"/>
  <text x="80" y="435" font-size="14" font-weight="700" fill="#ffffff">MCP Server · port 3000</text>
  <text x="1120" y="435" font-size="12" text-anchor="end" fill="#cdcdcd">
    @modelcontextprotocol/sdk · Express 5 · Stateless
  </text>

  <!-- 11 tools row -->
  <g font-size="10" fill="#0e0f0c">
    <!-- FHIR tools -->
    <rect x="80" y="462" width="180" height="56" rx="10" fill="#fff3e6" stroke="#d97706" stroke-width="1"/>
    <text x="170" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#7c4a02">FHIR Tools (3)</text>
    <text x="170" y="494" text-anchor="middle">fetch_patient_context</text>
    <text x="170" y="508" text-anchor="middle">fetch_medication_list · _history</text>

    <rect x="270" y="462" width="180" height="56" rx="10" fill="#fff3e6" stroke="#d97706" stroke-width="1"/>
    <text x="360" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#7c4a02">FHIR + LLM</text>
    <text x="360" y="494" text-anchor="middle">extract_clinical_evidence</text>
    <text x="360" y="508" text-anchor="middle">process_clinical_document (OCR)</text>

    <rect x="460" y="462" width="180" height="56" rx="10" fill="#e8f4ec" stroke="#0a7a3b" stroke-width="1"/>
    <text x="550" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#0a4521">RAG Tools (1)</text>
    <text x="550" y="494" text-anchor="middle">lookup_coverage_policy</text>
    <text x="550" y="508" text-anchor="middle">(244 CMS NCD chunks)</text>

    <rect x="650" y="462" width="180" height="56" rx="10" fill="#eef0fb" stroke="#3849a6" stroke-width="1"/>
    <text x="740" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#1e2a78">LLM Tools (3)</text>
    <text x="740" y="494" text-anchor="middle">check_coverage_requirements</text>
    <text x="740" y="508" text-anchor="middle">analyze · draft · appeal</text>

    <rect x="840" y="462" width="180" height="56" rx="10" fill="#fbebee" stroke="#a02525" stroke-width="1"/>
    <text x="930" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#5e1313">Safety / API</text>
    <text x="930" y="494" text-anchor="middle">check_drug_interactions</text>
    <text x="930" y="508" text-anchor="middle">(RxNorm REST · free)</text>
  </g>

  <!-- SHARP layer (cross-cutting) -->
  <rect x="80" y="530" width="1040" height="44" rx="10" fill="#f1ebfb" stroke="#6b3fa0" stroke-width="1"/>
  <text x="100" y="552" font-size="12" font-weight="700" fill="#6b3fa0">SHARP layer:</text>
  <text x="200" y="552" font-size="11" fill="#3a2a64">
    src/sharp/context.ts — getFhirContext(req), getPatientId(req): JWT claim → header → tool arg
  </text>
  <text x="100" y="568" font-size="11" fill="#6b3fa0">
    All FHIR tools accept patient_id as optional — SHARP-resolved by default. Token never logged. Stateless transport (sessionIdGenerator: undefined).
  </text>

  <!-- Outflow edges -->
  <line x1="170" y1="592" x2="170" y2="640" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="592" x2="360" y2="640" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="592" x2="550" y2="640" stroke="#0a7a3b" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="592" x2="740" y2="640" stroke="#3849a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="592" x2="930" y2="640" stroke="#a02525" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Downstream services -->
  <g>
    <rect x="100" y="640" width="170" height="68" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="185" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#7c4a02">HAPI FHIR R4</text>
    <text x="185" y="682" font-size="10" text-anchor="middle" fill="#454745">public · 9 resources</text>
    <text x="185" y="696" font-size="10" text-anchor="middle" fill="#454745">read-only · axios</text>
  </g>

  <g>
    <rect x="290" y="640" width="170" height="68" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="375" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#7c4a02">FHIR DocumentRef</text>
    <text x="375" y="682" font-size="10" text-anchor="middle" fill="#454745">+ tesseract.js</text>
    <text x="375" y="696" font-size="10" text-anchor="middle" fill="#454745">on-the-fly OCR</text>
  </g>

  <g>
    <rect x="480" y="640" width="170" height="68" rx="10" fill="#ffffff" stroke="#0a7a3b" stroke-width="2"/>
    <text x="565" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#0a4521">RAG Service · 3001</text>
    <text x="565" y="682" font-size="10" text-anchor="middle" fill="#454745">vectra · 244 chunks</text>
    <text x="565" y="696" font-size="10" text-anchor="middle" fill="#454745">all-MiniLM-L6-v2 (xenova local)</text>
  </g>

  <g>
    <rect x="670" y="640" width="170" height="68" rx="10" fill="#ffffff" stroke="#3849a6" stroke-width="2"/>
    <text x="755" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#1e2a78">Groq (cloud)</text>
    <text x="755" y="682" font-size="10" text-anchor="middle" fill="#454745">Llama 3.3 70B</text>
    <text x="755" y="696" font-size="10" text-anchor="middle" fill="#454745">JSON object mode · 0.2 temp</text>
  </g>

  <g>
    <rect x="860" y="640" width="170" height="68" rx="10" fill="#ffffff" stroke="#a02525" stroke-width="2"/>
    <text x="945" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#5e1313">RxNorm (NLM)</text>
    <text x="945" y="682" font-size="10" text-anchor="middle" fill="#454745">interaction REST</text>
    <text x="945" y="696" font-size="10" text-anchor="middle" fill="#454745">no key required</text>
  </g>

  <!-- Footer -->
  <text x="600" y="740" font-size="11" text-anchor="middle" fill="#6b6b6b">
    11 MCP tools · 3 services · 4 standards · 0 patient data on disk
  </text>
</svg>
